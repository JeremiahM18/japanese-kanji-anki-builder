name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency_review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2 pinned from refs/tags/v4.2.2 on 2026-05-26.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run dependency review
        # actions/dependency-review-action@v5.0.0 pinned from refs/tags/v5.0.0 on 2026-06-02.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate

  security_advisory:
    name: Advisory Audit Ubuntu Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2 pinned from refs/tags/v4.2.2 on 2026-05-26.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        # actions/setup-node@v4 pinned from refs/tags/v4 on 2026-05-22.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Audit supply-chain policy
        run: npm run supply-chain:audit

      - name: Audit branch protection policy
        run: npm run security:branch-protection

      - name: Audit tracked files for secrets
        run: npm run security:secrets

      - name: Install dependencies
        run: npm ci

      - name: Run npm advisory audit
        run: npm run security:advisories

  verify:
    name: Verify Ubuntu Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20
          - 22

    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2 pinned from refs/tags/v4.2.2 on 2026-05-26.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        # actions/setup-node@v4 pinned from refs/tags/v4 on 2026-05-22.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Audit supply-chain policy
        run: npm run supply-chain:audit

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify performance and memory audit matrix
        run: npm run perf:memory:matrix

      - name: Validate Obsidian proof ledger
        run: npm run data:obsidian:proof:validate

      - name: Reconcile kanji Obsidian proof ledger parity
        run: npm run data:obsidian:proof:reconcile -- --levels=5,4,3,2

      - name: Reconcile word Obsidian proof ledger parity
        run: npm run data:obsidian:proof:reconcile -- --deck-kind=word --levels=5,4

      - name: Verify Obsidian proof provider parity
        run: npm run data:obsidian:proof:provider-parity -- --levels=5,4,3,2 --row-source=tracked-review-set

      - name: Verify Obsidian proof provider parity for batch selector
        run: npm run data:obsidian:proof:provider-parity -- --consumer=kanji-batch-report --levels=5,4,3,2 --queue=substantive-rereview --limit=8 --row-source=tracked-review-set

      - name: Verify Obsidian proof provider parity for platinum level gate
        run: npm run data:obsidian:proof:provider-parity -- --consumer=kanji-platinum-level --levels=5,4,3,2 --row-source=tracked-review-set

      - name: Verify Obsidian proof provider parity for kanji field-source contract
        run: npm run data:obsidian:proof:provider-parity -- --consumer=kanji-field-source-contract --levels=5,4,3,2 --row-source=tracked-review-set

      - name: Verify Obsidian proof provider parity for platinum governance gate
        run: npm run data:obsidian:proof:provider-parity -- --consumer=platinum-governance-gate --levels=5,4,3,2 --row-source=tracked-review-set

      - name: Verify Obsidian proof provider parity for word rereview status
        run: npm run data:obsidian:proof:provider-parity -- --consumer=word-rereview-status --deck-kind=word --levels=5,4 --row-source=tracked-review-set

      - name: Verify Obsidian proof provider parity for word certification status
        run: npm run data:obsidian:proof:provider-parity -- --consumer=word-certify-status --deck-kind=word --levels=5,4 --row-source=tracked-review-set

      - name: Verify Obsidian proof provider parity for word batch selector
        run: npm run data:obsidian:proof:provider-parity -- --consumer=word-batch-report --deck-kind=word --levels=5,4 --queue=substantive-rereview --limit=8 --row-source=tracked-review-set

      - name: Verify Obsidian proof provider parity for word platinum level gate
        run: npm run data:obsidian:proof:provider-parity -- --consumer=word-platinum-level --deck-kind=word --levels=5,4 --row-source=tracked-review-set

      - name: Verify Obsidian proof provider parity for word governance inputs
        run: npm run data:obsidian:proof:provider-parity -- --consumer=word-governance-inputs --deck-kind=word --levels=5,4 --row-source=tracked-review-set

      - name: Run tracked JLPT kanji source governance audit
        run: npm run data:audit:jlpt:sources -- --governance-strict --limit=25

      - name: Verify tracked JLPT kanji taxonomy alignment
        run: npm run data:audit:jlpt -- --strict --tracked-only

      - name: Verify tracked JLPT word taxonomy alignment
        run: npm run data:audit:jlpt:words

      - name: Run manifest-only word platinum source posture
        run: npm run deck:words:platinum:source-posture -- --levels=5,4

      # deck:platinum:governance-gate is intentionally local-data release QA.
      # Clean GitHub Actions checkouts do not include ignored data/* generated-row inputs.

  smoke:
    name: Smoke ${{ matrix.os }} Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - 18
          - 22

    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2 pinned from refs/tags/v4.2.2 on 2026-05-26.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        # actions/setup-node@v4 pinned from refs/tags/v4 on 2026-05-22.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Audit supply-chain policy
        run: npm run supply-chain:audit

      - name: Install dependencies
        run: npm ci

      - name: Run release smoke verification
        run: npm run ci:smoke -- --root-dir=.ci-smoke --keep-temp-dir

      - name: Upload smoke artifacts
        if: always()
        # actions/upload-artifact@v4 pinned from refs/tags/v4 on 2026-05-22.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-smoke-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: .ci-smoke/out
          if-no-files-found: error

  release_gate:
    name: Release Gate Ubuntu Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - verify
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2 pinned from refs/tags/v4.2.2 on 2026-05-26.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        # actions/setup-node@v4 pinned from refs/tags/v4 on 2026-05-22.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        # actions/setup-python@v5 pinned from refs/tags/v5 on 2026-05-22.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Audit supply-chain policy
        run: npm run supply-chain:audit

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:gate -- --root-dir=.release-gate --keep-temp-dir --require-apkg-tools

      - name: Upload release-gate artifacts
        if: always()
        # actions/upload-artifact@v4 pinned from refs/tags/v4 on 2026-05-22.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gate-ubuntu-node-22
          path: .release-gate/out
          if-no-files-found: error
