name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_verify:
    name: Release Verify Ubuntu Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2 pinned from refs/tags/v4.2.2 on 2026-05-26.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        # actions/setup-node@v4 pinned from refs/tags/v4 on 2026-05-22.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        # actions/setup-python@v5 pinned from refs/tags/v5 on 2026-05-22.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Audit supply-chain policy
        run: npm run supply-chain:audit

      - name: Audit branch protection policy
        run: npm run security:branch-protection

      - name: Install dependencies
        run: npm ci

      - name: Run npm advisory audit
        run: npm run security:advisories

      - name: Run tests
        run: npm test

      - name: Run release gate
        run: npm run release:gate -- --root-dir=.release-gate --keep-temp-dir --require-apkg-tools

      - name: Upload release gate verification artifacts
        if: always()
        # actions/upload-artifact@v4 pinned from refs/tags/v4 on 2026-05-22.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gate-${{ github.ref_name }}
          path: .release-gate/out
          if-no-files-found: error

  release_bundle:
    name: Release Bundle Ubuntu Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - release_verify
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2 pinned from refs/tags/v4.2.2 on 2026-05-26.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        # actions/setup-node@v4 pinned from refs/tags/v4 on 2026-05-22.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        # actions/setup-python@v5 pinned from refs/tags/v5 on 2026-05-22.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Audit supply-chain policy
        run: npm run supply-chain:audit

      - name: Audit branch protection policy
        run: npm run security:branch-protection

      - name: Install dependencies
        run: npm ci

      - name: Run npm advisory audit
        run: npm run security:advisories

      - name: Run deterministic smoke packaging
        run: npm run ci:smoke -- --root-dir=.release-smoke --keep-temp-dir

      - name: Run release gate
        run: npm run release:gate -- --root-dir=.release-gate --keep-temp-dir --require-apkg-tools

      - name: Generate artifact checksums
        run: |
          find .release-smoke/out .release-gate/out -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-artifacts.sha256

      - name: Upload tagged release bundle
        # actions/upload-artifact@v4 pinned from refs/tags/v4 on 2026-05-22.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle-${{ github.ref_name }}
          path: |
            .release-smoke/out
            .release-gate/out
            CHANGELOG.md
            NOTICE.md
            docs/compatibility-matrix.md
            docs/branch-protection.md
            docs/release-process.md
            docs/release-qa-checklist.md
            release-artifacts.sha256
          if-no-files-found: error
