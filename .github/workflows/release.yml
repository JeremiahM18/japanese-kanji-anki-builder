name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_INPUT_DIR: .release-input
  RELEASE_PACKET: .release-input/release-qa-evidence.json

jobs:
  release_verify:
    name: Release Verify Ubuntu Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub hides draft releases from tokens without push-level contents access.
    # This job reads and validates the draft but has no publication step.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        # actions/checkout@v6.0.3 pinned from refs/tags/v6.0.3 on 2026-06-03.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        # actions/setup-node@v6.4.0 pinned from refs/tags/v6.4.0 on 2026-06-03.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        # actions/setup-python@v6.2.0 pinned from refs/tags/v6.2.0 on 2026-06-03.
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"

      - name: Verify tag and draft prerelease boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          test "$(node -p "'v' + require('./package.json').version")" = "${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          release_state="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')"
          test "${release_state}" = $'true\ttrue'

      - name: Download exact draft release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "${RELEASE_INPUT_DIR}"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir "${RELEASE_INPUT_DIR}"

      - name: Validate release evidence and asset integrity
        run: npm run product:release-qa:evidence -- --packet="${RELEASE_PACKET}" --artifact-dir="${RELEASE_INPUT_DIR}" --expected-tag="${GITHUB_REF_NAME}"

      - name: Inspect release APKG structures
        run: npm run product:release-qa:apkg-inspect -- --packet="${RELEASE_PACKET}" --artifact-dir="${RELEASE_INPUT_DIR}" --require-golden

      - name: Materialize dependencies without lifecycle scripts
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci --ignore-scripts

      - name: Audit supply-chain policy
        run: npm run supply-chain:audit

      - name: Audit dependency licenses
        run: npm run security:licenses

      - name: Audit branch protection policy
        run: npm run security:branch-protection

      - name: Audit security requirements traceability
        run: npm run security:requirements

      - name: Audit SDLC security metrics
        run: npm run security:sdlc-metrics

      - name: Audit pre-release trust posture
        run: npm run security:release-trust:pre

      - name: Audit tracked files for secrets
        run: npm run security:secrets

      - name: Validate CycloneDX SBOM generation
        run: npm run security:sbom

      - name: Activate reviewed dependency lifecycle scripts
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm rebuild

      - name: Run npm advisory audit
        run: npm run security:advisories

      - name: Run tests
        run: npm test

      - name: Run tracked-only N5 readiness orchestrator
        run: npm run product:readiness:n5 -- --tracked-only

      - name: Run release gate
        run: npm run release:gate -- --root-dir=.release-gate --keep-temp-dir --require-apkg-tools

      - name: Upload release verification diagnostics
        if: always()
        # actions/upload-artifact@v7.0.1 pinned from refs/tags/v7.0.1 on 2026-06-03.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-verification-${{ github.ref_name }}
          path: |
            .release-input
            .release-gate/out
          if-no-files-found: warn

  release_bundle:
    name: Release Bundle Ubuntu Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - release_verify
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        # actions/checkout@v6.0.3 pinned from refs/tags/v6.0.3 on 2026-06-03.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        # actions/setup-node@v6.4.0 pinned from refs/tags/v6.4.0 on 2026-06-03.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        # actions/setup-python@v6.2.0 pinned from refs/tags/v6.2.0 on 2026-06-03.
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"

      - name: Download exact draft release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "${RELEASE_INPUT_DIR}"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir "${RELEASE_INPUT_DIR}"

      - name: Revalidate release evidence and APKG structures
        run: |
          set -euo pipefail
          npm run product:release-qa:evidence -- --packet="${RELEASE_PACKET}" --artifact-dir="${RELEASE_INPUT_DIR}" --expected-tag="${GITHUB_REF_NAME}"
          npm run product:release-qa:apkg-inspect -- --packet="${RELEASE_PACKET}" --artifact-dir="${RELEASE_INPUT_DIR}" --require-golden

      - name: Materialize dependencies without lifecycle scripts
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci --ignore-scripts

      - name: Audit supply-chain policy
        run: npm run supply-chain:audit

      - name: Audit dependency licenses
        run: npm run security:licenses

      - name: Audit branch protection policy
        run: npm run security:branch-protection

      - name: Audit security requirements traceability
        run: npm run security:requirements

      - name: Audit SDLC security metrics
        run: npm run security:sdlc-metrics

      - name: Audit pre-release trust posture
        run: npm run security:release-trust:pre

      - name: Audit tracked files for secrets
        run: npm run security:secrets

      - name: Validate CycloneDX SBOM generation
        run: npm run security:sbom

      - name: Activate reviewed dependency lifecycle scripts
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm rebuild

      - name: Run npm advisory audit
        run: npm run security:advisories

      - name: Run deterministic smoke packaging
        run: npm run ci:smoke -- --root-dir=.release-smoke --keep-temp-dir

      - name: Run release gate
        run: npm run release:gate -- --root-dir=.release-gate --keep-temp-dir --require-apkg-tools

      - name: Generate CycloneDX SBOM
        run: node scripts/generateCycloneDxSbom.js --out=.release-bundle/sbom.cdx.json

      - name: Generate dependency license summary
        run: node scripts/auditDependencyLicenses.js --out=.release-bundle/dependency-licenses.json

      - name: Stage exact release assets and deterministic verification material
        run: |
          set -euo pipefail
          mkdir -p .release-bundle
          cp "${RELEASE_PACKET}" .release-bundle/release-qa-evidence.json
          cp "${RELEASE_INPUT_DIR}"/*.apkg .release-bundle/
          tar --sort=name --mtime='UTC 2024-01-01' --owner=0 --group=0 --numeric-owner \
            -czf .release-bundle/release-verification-materials.tar.gz \
            .release-smoke/out .release-gate/out CHANGELOG.md NOTICE.md \
            docs/compatibility-matrix.md docs/branch-protection.md \
            docs/release-process.md docs/release-qa-checklist.md \
            docs/releases/v0.3.0-beta.4-n5-automation-preview.md

      - name: Generate and verify release asset checksums
        run: |
          set -euo pipefail
          find .release-bundle -type f ! -name 'release-artifacts.sha256' -print0 \
            | sort -z \
            | xargs -0 sha256sum > .release-bundle/release-artifacts.sha256
          sha256sum -c .release-bundle/release-artifacts.sha256

      - name: Attest release bundle provenance
        # actions/attest@v4.1.0 pinned from refs/tags/v4 on 2026-06-02.
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: .release-bundle/**

      - name: Attest release bundle SBOM
        # actions/attest@v4.1.0 pinned from refs/tags/v4 on 2026-06-02.
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: .release-bundle/**
          sbom-path: .release-bundle/sbom.cdx.json

      - name: Verify release bundle attestations for every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer_workflow="github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          while IFS= read -r -d '' artifact; do
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${signer_workflow}" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}"
          done < <(find .release-bundle -maxdepth 1 -type f -print0 | sort -z)

      - name: Upload immutable release bundle evidence
        # actions/upload-artifact@v7.0.1 pinned from refs/tags/v7.0.1 on 2026-06-03.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle-${{ github.ref_name }}
          path: .release-bundle
          if-no-files-found: error
          include-hidden-files: true

      - name: Publish verified GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" .release-bundle/* --clobber --repo "${GITHUB_REPOSITORY}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease --verify-tag --repo "${GITHUB_REPOSITORY}"
